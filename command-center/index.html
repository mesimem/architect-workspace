<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Center</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div id="topnav-root"></div>

<main class="container" id="page-root">
  <div id="paused"></div>

  <div class="page-header">
    <h1 id="cc-title"></h1>
    <p class="page-desc" id="cc-descriptor"></p>
  </div>

  <div class="section">
    <h2>Where we are</h2>
    <div class="grid" id="where-we-are"></div>
  </div>

  <div class="section">
    <h2>How far along</h2>
    <div class="grid" id="progress"></div>
  </div>

  <div class="section">
    <h2>What is live, and what is not</h2>
    <div class="grid" id="whats-live"></div>
  </div>

  <div class="section">
    <h2>All tabs</h2>
    <div class="tile-grid" id="tab-grid"></div>
  </div>

  <footer class="site-footer">
    Read at runtime from <code>.colaberry/plan.json</code>, <code>.colaberry/progress.json</code> and
    <code>.colaberry/manifest.json</code>. Nothing on this page is live: it is as of the last sync.
    The Sample/Real switch applies to every tab.
  </footer>
</main>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
  var esc = Site.escapeHtml;

  // One card that drills down to the tab holding its detail.
  var card = Site.card;

  function releaseName(data, key) {
    var r = data.releases.filter(function (x) { return x.key === key; })[0];
    return r ? esc(r.key + " - " + r.name) : esc(key || "-");
  }

  function renderWhereWeAre(data) {
    var s = data.schedule;
    var today = Site.todayISO();
    var phase = CCData.phaseOf(s, data.releases, today);
    var phaseValue, phaseSub;
    if (phase.kind === "release") {
      phaseValue = releaseName(data, phase.release.key);
      phaseSub = Site.fmtDate(phase.release.startsOn) + " to " + Site.fmtDate(phase.release.endsOn);
    } else if (phase.kind === "demo_prep") {
      phaseValue = "Demo prep";
      phaseSub = "Build ended " + Site.fmtDate(s.build_end) + "; demo is " + Site.fmtDate(s.demo_day);
    } else if (phase.kind === "before") {
      phaseValue = "Before the build";
      phaseSub = "Build starts " + Site.fmtDate(s.build_start);
    } else if (phase.kind === "after") {
      phaseValue = "Term complete";
      phaseSub = "Demo day was " + Site.fmtDate(s.demo_day);
    } else {
      phaseValue = "Between releases";
      phaseSub = phase.next ? "Next: " + releaseName(data, phase.next.key) + " on " + Site.fmtDate(phase.next.startsOn) : "No later release scheduled";
    }

    var demoDays = s.demo_day ? Site.daysBetween(today, s.demo_day) : null;
    var demoSub = demoDays === null ? "No demo day in the plan" :
      demoDays > 0 ? demoDays + " days away" : demoDays === 0 ? "Today" : Math.abs(demoDays) + " days ago";

    document.getElementById("where-we-are").innerHTML =
      card("pm.html", "WHERE IN THE TERM", phaseValue, phaseSub, false) +
      card("pm.html", "DEMO DAY", esc(Site.fmtDate(s.demo_day)), esc(demoSub), false) +
      card("pm.html", "DEMO SCOPE", releaseName(data, s.demo_release_key),
        "The release you demo. Later releases are roadmap.", false);
  }

  function renderProgress(data) {
    var t = data.totals;
    var el = document.getElementById("progress");
    if (!t) {
      el.innerHTML = '<div class="empty-state">progress.json carries no totals yet - not checked, which is not the same as zero.</div>';
      return;
    }
    var sample = data.isSample;
    var points = t.points_awarded === null || t.points_awarded === undefined ? "not awarded yet" : esc(String(t.points_awarded));
    var untracked = data.stories.filter(function (st) { return st.state === null; }).map(function (st) { return st.id; });
    var storySub = esc(t.stories_in_progress + " in progress, " + t.stories_submitted + " submitted, " + t.stories_not_started + " not started");
    if (untracked.length) storySub += "<br>" + esc(untracked.join(", ") + " in the plan, not checked yet");
    el.innerHTML =
      card("pm.html", "STORIES VERIFIED", esc(t.stories_verified + " of " + t.stories_total), storySub, sample) +
      card("kb.html", "ACCEPTANCE CRITERIA PASSED", esc(t.criteria_passed + " of " + t.criteria_total),
        "Ticked in progress.json and confirmed by the platform", sample) +
      card("pm.html", "POINTS AWARDED", points, "Awarded by the platform on verification", sample);
  }

  function renderWhatsLive(data) {
    var sample = data.isSample;
    var guardrailCards = data.guardrails.map(function (g) {
      var by = g.enforcedBy.length ? g.enforcedBy.join(", ") : "no story";
      var value = g.kept ? "Kept" : "Not yet kept";
      var sub = esc(g.statement) + "<br>" + (g.kept
        ? esc("Enforced by " + by + " (verified)")
        : esc("A promise made and not yet kept - " + by + " not verified"));
      return card("guardrails.html", "GUARDRAIL " + g.id, value, sub, sample);
    }).join("");
    if (!data.guardrails.length) {
      guardrailCards = '<div class="empty-state">The plan has no SAFE requirement, so no guardrails. Worth fixing before building further.</div>';
    }

    var systemsCard = data.systems.length
      ? card("systems.html", "EXTERNAL SYSTEMS", esc(String(data.systems.length)),
          Site.statusDot("unknown", null, "Connection not checked"), sample)
      : card("systems.html", "EXTERNAL SYSTEMS", "None named",
          "The plan names no external system yet.", false);

    document.getElementById("whats-live").innerHTML = guardrailCards + systemsCard;
  }

  function renderTabs() {
    document.getElementById("tab-grid").innerHTML = Site.TABS.map(function (t) {
      var meta = t.id === "overview" ? "you are here" : t.built ? "open" : "not built yet - open to see what goes here";
      return '<a class="tile' + (t.id === "overview" ? " current" : "") + '" href="' + t.href + '">' +
        '<div class="tile-title">' + esc(t.label) + '</div>' +
        '<div class="tile-desc">' + esc(t.desc) + '</div>' +
        '<div class="tile-meta">' + esc(meta) + '</div></a>';
    }).join("");
  }

  Site.boot("overview", function (data) {
    document.title = "Command Center - " + data.project.name;
    document.getElementById("paused").innerHTML = Site.pausedBanner();
    document.getElementById("cc-title").textContent = data.project.name;
    document.getElementById("cc-descriptor").textContent = data.project.descriptor;
    renderWhereWeAre(data);
    renderProgress(data);
    renderWhatsLive(data);
    renderTabs();
  });
</script>
</body>
</html>
